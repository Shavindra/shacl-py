[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shacl-py"
version = "0.1.0"
description = "Minimal Python viewer for DataLad Concepts metadata"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["streamlit>=1.55,<2", "PyYAML>=6,<7", "jsonschema>=4.26,<5"]

[project.optional-dependencies]
dev = ["ruff>=0.15", "pytest>=9", "build>=1.4", "linkml>=1.10,<2"]

[project.scripts]
shacl-py = "shacl_py.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shacl_py"]

[tool.ruff]
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
