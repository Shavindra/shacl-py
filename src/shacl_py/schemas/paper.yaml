id: https://github.com/Shavindra/shacl-py/schema/paper/v1
name: shacl-py-paper
version: 1.2.0
prefixes:
  linkml: https://w3id.org/linkml/
  local: https://github.com/Shavindra/shacl-py/schema/paper/v1/
  dlthings: https://concepts.datalad.org/s/things/v2/
  dcterms: http://purl.org/dc/terms/
  skos: http://www.w3.org/2004/02/skos/core#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: local
imports:
  - things-v2
classes:
  Paper:
    is_a: Thing
    tree_root: true
    slots:
      - display_fields
      - source_url
      - review_status
      - local_folder
      - data_file_patterns
      - dataset_file_patterns
    slot_usage:
      pid:
        required: true
        pattern: '^\S+:\S+$'
      display_label:
        required: true
        pattern: '\S'
      description:
        required: false
        pattern: '\S'
slots:
  display_fields: {range: string, multivalued: true, description: Ordered field names for the viewer header.}
  source_url:
    slot_uri: dcterms:source
    range: uri
    required: false
    pattern: '^https?://[^\s/]+'
    description: DOI resolver URL or source URL.
  review_status:
    range: ReviewStatus
  local_folder:
    range: string
    required: true
    pattern: '\S'
    description: Folder path relative to the metadata file, within the supplied root.
  data_file_patterns:
    range: ProjectFilePattern
    multivalued: true
    description: Project-relative globs selecting data files for display.
  dataset_file_patterns:
    range: ProjectFilePattern
    multivalued: true
    description: Project-relative globs selecting files that describe the dataset.
types:
  ProjectFilePattern:
    typeof: string
    description: A relative POSIX file glob. Use ** for recursive matching.
    pattern: '^(?!/|[A-Za-z]:|(?:.*/)?\.\.(?:/|$))(?=.*\S)[^\\\r\n]+$'
enums:
  ReviewStatus:
    permissible_values:
      unreviewed:
      reviewing:
      useful:
      excluded:
