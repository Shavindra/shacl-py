id: https://github.com/Shavindra/shacl-py/schema/catalogue/v1
name: shacl-py-catalogue
version: 1.5.0
prefixes:
  linkml: https://w3id.org/linkml/
  local: https://github.com/Shavindra/shacl-py/schema/catalogue/v1/
  dcterms: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
default_prefix: local
imports:
  - things-social-v1
  - things-publications-v1
  - things-data-v1
classes:
  Catalogue:
    tree_root: true
    attributes:
      project: {range: LocalProject, inlined: true, required: true}
      publications: {range: LocalPublication, multivalued: true, inlined_as_list: true}
      datasets: {range: LocalDataset, multivalued: true, inlined_as_list: true}
      reviews: {range: Review, multivalued: true, inlined_as_list: true}
  LocalProject:
    is_a: Project
    slots: [source_url, local_folder, file_groups]
    attributes:
      term_vocabulary: {range: IndexTerm, multivalued: true, inlined_as_list: true}
  LocalPublication:
    is_a: Publication
    slots: [source_url, local_folder, file_groups, author_names, highlighted, keywords, index_terms]
    attributes:
      primary_author: {range: string, pattern: '\S', description: Explicit primary author display name.}
      dataset_links: {range: DatasetLink, multivalued: true, inlined_as_list: true}
  LocalDataset:
    is_a: Dataset
    slots: [source_url, local_folder, file_groups, author_names, highlighted, keywords, index_terms]
    attributes:
      linked_files: {range: LinkedFile, multivalued: true, inlined_as_list: true}
      source_datasets:
        range: LocalDataset
        multivalued: true
        slot_uri: prov:wasDerivedFrom
      notebook_path:
        range: string
        description: Project-relative path to the notebook used to produce this dataset.
  IndexTerm:
    description: A subject or property in the project's searchable vocabulary.
    attributes:
      id: {identifier: true, range: uriorcurie, pattern: '^[A-Za-z][A-Za-z0-9+.-]*:\S+$'}
      label: {range: string, required: true, pattern: '\S'}
      aliases: {range: string, multivalued: true}
      broader: {range: IndexTerm, description: A broader term in the same vocabulary.}
  TermAssignment:
    description: A term describing this record, optionally qualified by the subject it describes.
    attributes:
      term: {range: IndexTerm, required: true}
      subject: {range: IndexTerm}
      note: {range: string, description: What the source reports or the dataset contains.}
  LinkedFile:
    slots: [attributes]
    attributes:
      name: {range: string, required: true, pattern: '\S'}
      url: {range: uri, required: true, pattern: '^https?://[^\s/]+(?:[/?#]\S*)?$'}
      preview_url: {range: uri, pattern: '^https?://[^\s/]+(?:[/?#]\S*)?$'}
      provider_url: {range: uri, pattern: '^https?://[^\s/]+(?:[/?#]\S*)?$'}
  DatasetLink:
    attributes:
      dataset: {range: LocalDataset, required: true}
      role: {range: DatasetRole, required: true}
  Review:
    description: A publication review in the context of the enclosing project.
    attributes:
      publication: {range: LocalPublication, required: true}
      status: {range: string, pattern: '\S'}
      notes: {range: string}
      outputs: {range: LocalDataset, multivalued: true}
  CatalogueAttribute:
    is_a: AttributeSpecification
    description: An attribute whose annotations can describe inputs and outputs.
    slot_usage:
      annotations: {range: AttributeAnnotations, multivalued: false, inlined: true}
  AttributeAnnotations:
    description: Concepts tag/value annotations with optional lists of method inputs and outputs.
    extra_slots:
      range_expression:
        any_of:
          - {range: string}
          - {range: AnnotationValue}
    attributes:
      inputs: &resources
        any_of:
          - {range: string}
          - {range: AnnotationValue}
          - multivalued: true
            inlined_as_list: true
            any_of:
              - {range: string}
              - {range: MethodResource}
      outputs: *resources
  AnnotationValue:
    attributes:
      annotation_tag: {range: string}
      annotation_value: {range: string}
  MethodResource:
    attributes:
      label: {range: string, required: true, pattern: '\S'}
      ref: {range: string, description: Dataset PID or file reference scoped to the record.}
  FileGroup:
    attributes:
      label: {range: string, required: true, pattern: '\S'}
      paths:
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 1
        description: Literal files or directories relative to the record's local folder.
      section: {range: FileSection}
slots:
  index_terms: {range: TermAssignment, multivalued: true, inlined_as_list: true}
  highlighted: {range: boolean, description: Star this record and show it first in viewer lists.}
  local_folder:
    range: string
    description: Local folder relative to the project metadata file.
  source_url:
    range: uri
    slot_uri: dcterms:source
    pattern: '^https?://[^\s/]+'
  file_groups: {range: FileGroup, multivalued: true, inlined_as_list: true}
  author_names: {range: string, multivalued: true}
enums:
  DatasetRole:
    permissible_values:
      related:
      describes:
      reuses:
      output:
        description: A local analysis output associated with work on this publication.
  FileSection:
    permissible_values:
      files:
      documentation:
