<div class="network">
  <svg class="canvas" role="group" aria-label="Network of papers, datasets and labels"></svg>
  <div class="controls" role="group" aria-label="Graph zoom">
    <button type="button" data-action="out" aria-label="Zoom out">−</button>
    <button type="button" data-action="in" aria-label="Zoom in">+</button>
    <button type="button" data-action="fit" aria-label="Fit graph">Fit</button>
  </div>
</div>
