name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m build
      - run: |
          python -m venv /tmp/shacl-wheel
          /tmp/shacl-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/shacl-wheel/bin/shacl-py --help
          /tmp/shacl-wheel/bin/shacl-py validate "$GITHUB_WORKSPACE/examples"
