schema_version: 1
context:
  python_min: '3.14'
package:
  name: shacl-py
  version: 0.4.0
source:
  url: https://codeload.github.com/Shavindra/shacl-py/tar.gz/48b4abeeb9e95bcab1b857dc2bf6857c4b003eb8
  sha256: 6b8b968f81dc02952674659b38d3bed915b2a8788f9d35cd6c75eddf051ee530
build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -v
  python:
    entry_points:
    - shacl-py = shacl_py.cli:main
requirements:
  host:
  - python ${{ python_min }}.*
  - pip
  - hatchling
  run:
  - python >=${{ python_min }}
  - jinja2 >=3.1,<4
  - filelock <4,>=3.12
  - datalad-metalad <0.5,>=0.4.22
  - streamlit <2,>=1.55
  - pyyaml <7,>=6
  - jsonschema <5,>=4.26
  - ruamel.yaml <0.20,>=0.18.6
tests:
- python:
    imports:
    - shacl_py
    pip_check: true
- script:
  - shacl-py --help
about:
  homepage: https://github.com/Shavindra/shacl-py
  summary: Minimal Python viewer for DataLad Concepts metadata
  license: MIT AND CC-BY-4.0
  license_file:
  - LICENSE
  - src/shacl_py/schemas/CONCEPTS-LICENSE
  - src/shacl_py/schemas/PROVENANCE.md
extra:
  recipe-maintainers:
  - Shavindra
